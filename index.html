<!doctype html>
<html lang="pl" data-card-back="four-color">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pokerzone-online-url" content="">
  <title>PokerZone</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/deck-themes.css">
  <link rel="stylesheet" href="css/zone.css">
  <script defer src="js/cards.js"></script>
  <script defer src="js/avatars.js"></script>
  <script defer src="js/chips.js"></script>
  <script defer src="js/bots.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/history.js"></script>
  <script defer src="js/view.js"></script>
  <script defer src="js/hand-review.js"></script>
  <script defer src="js/history-view.js"></script>
  <script defer src="js/effects.js"></script>
  <script defer src="js/profile.js"></script>
  <script defer src="js/sessions.js"></script>
  <script defer src="js/menu.js"></script>
  <script defer src="js/tooltips.js"></script>
  <script defer src="js/chat.js"></script>
  <script defer src="js/tutorial.js"></script>
  <script defer src="js/online.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="topline">
      <h1 class="zone-brand"><span class="zone-visually-hidden">PokerZone</span></h1>
      <output class="bankroll-display header-bankroll" id="header-bankroll" tabindex="0" aria-label="Twój bankroll" data-tooltip="Kwota do wykorzystania w trakcie gry.">
        <span class="bankroll-icon" aria-hidden="true"></span><span data-bankroll-amount>—</span>
      </output>
      <div class="header-actions">
        <div id="leave-table-action" hidden>
          <button class="reset game-menu-button leave-table-button" type="button" id="leaveTable" aria-haspopup="dialog" aria-controls="game-setup" data-tooltip="Żetony spoza puli wrócą do bankrolla. Możesz wybrać inny stół.">Opuść stół</button>
        </div>
        <button class="reset game-menu-button leave-table-button" type="button" id="end-tutorial" aria-haspopup="dialog" aria-controls="game-setup" hidden>Zakończ samouczek</button>
        <button class="reset game-menu-button leave-table-button" type="button" id="end-online" aria-haspopup="dialog" aria-controls="game-setup" hidden>Opuść stół online</button>
        <button class="reset game-menu-button" type="button" id="game-menu" aria-haspopup="dialog" aria-controls="game-setup">Menu</button>
      </div>
    </header>
    <p class="online-table-status" id="online-table-status" role="status" hidden></p>
    <div id="app" aria-live="polite"></div>
    <section class="panel hand-history" id="hand-history" aria-labelledby="hand-history-title" hidden></section>
  </main>
  <dialog class="setup-dialog zone-dialog zone-surface" id="game-setup" aria-labelledby="setup-title" closedby="none">
    <span class="seat-avatar setup-portrait" id="setup-portrait" aria-hidden="true"></span>
    <header class="zone-dialog-heading setup-heading">
      <h2 class="zone-visually-hidden" id="setup-title">Nowa gra</h2>
      <span class="zone-brand setup-brand" aria-hidden="true"></span>
      <button class="reset sound-toggle" type="button" id="setup-sound" aria-label="Dźwięk" aria-pressed="true">
        <span class="sound-icon" aria-hidden="true"><span class="sound-wave"></span></span>
      </button>
      <button class="reset zone-close" type="button" id="close-setup" aria-label="Wróć do gry" hidden>×</button>
    </header>
    <form id="setup-form">
      <div class="setup-account">
        <div>
          <label class="setup-account-label" for="setup-bankroll">Twój bankroll</label>
          <output class="bankroll-display setup-bankroll" id="setup-bankroll" tabindex="0" data-tooltip="Kwota do wykorzystania w trakcie gry.">
            <span class="bankroll-icon" aria-hidden="true"></span><span data-bankroll-amount>—</span>
          </output>
        </div>
        <div class="setup-account-profile">
          <span class="setup-account-label">Profil</span>
          <button class="header-profile setup-profile" type="button" id="setup-profile" aria-haspopup="dialog" aria-controls="player-profile" aria-label="Wyświetl profil">
            <span class="seat-avatar" aria-hidden="true"></span>
            <span class="header-profile-name">Ty</span>
          </button>
        </div>
      </div>
      <div class="setup-fields">
        <fieldset class="setup-stakes">
          <legend>Stawki</legend>
          <input type="hidden" id="setup-stakes" name="bigBlind">
          <div class="stake-options" id="setup-stake-options">
            <button class="stake-choice tutorial-choice" id="setup-tutorial" type="button" aria-controls="app">Samouczek</button>
          </div>
        </fieldset>
        <fieldset class="setup-buy-in">
          <legend id="setup-buy-in-label">Wpisowe</legend>
          <div class="setup-slider-row">
            <div class="raise-stepper">
              <button class="raise-step" id="setup-buy-in-less" type="button" aria-label="Zmniejsz wpisowe"><span aria-hidden="true">−</span></button>
              <input id="setup-buy-in" name="buyIn" type="range" aria-labelledby="setup-buy-in-label">
              <button class="raise-step" id="setup-buy-in-more" type="button" aria-label="Zwiększ wpisowe"><span aria-hidden="true">+</span></button>
            </div>
            <output class="setup-buy-in-amount" id="setup-buy-in-amount" for="setup-buy-in" aria-hidden="true"></output>
          </div>
        </fieldset>
        <fieldset class="setup-player-control">
          <legend id="setup-player-label">Liczba graczy <span id="setup-player-count" aria-hidden="true"></span></legend>
          <div class="setup-slider-row">
            <div class="raise-stepper">
              <button class="raise-step" id="setup-players-less" type="button" aria-label="Zmniejsz liczbę graczy"><span aria-hidden="true">−</span></button>
              <input id="setup-players" name="playerCount" type="range" step="1" aria-labelledby="setup-player-label">
              <button class="raise-step" id="setup-players-more" type="button" aria-label="Zwiększ liczbę graczy"><span aria-hidden="true">+</span></button>
            </div>
            <div class="setup-player-icons" id="setup-player-icons" aria-hidden="true"></div>
          </div>
        </fieldset>
      </div>
      <fieldset class="setup-backs">
        <legend>Rewers kart</legend>
        <div class="setup-back-options" id="setup-back-options"></div>
      </fieldset>
      <div class="setup-controls">
        <button class="zone-art-button zone-start-game" type="submit" id="start-game" autofocus><span class="zone-play-icon" aria-hidden="true"></span><span id="setup-start-label">Rozpocznij grę</span></button>
      </div>
    </form>
    <div class="setup-actions">
      <button type="button" class="zone-art-button" id="open-online" aria-haspopup="dialog" aria-controls="online-dialog">Graj online</button>
      <button type="button" class="zone-art-button" id="save-session" aria-haspopup="dialog" hidden disabled>Zapisz sesję</button>
      <button type="button" class="zone-art-button" id="setup-resume" aria-haspopup="dialog" disabled>Wznów sesję</button>
      <button type="button" class="zone-art-button" id="change-table" hidden disabled>Zmień stół</button>
      <a class="zone-art-button" id="open-history" href="#hand-history">Historia</a>
    </div>
    <p class="menu-status" data-menu-status role="status" hidden></p>
  </dialog>
  <dialog class="setup-dialog zone-dialog zone-surface" id="online-dialog" aria-labelledby="online-title">
    <header class="zone-dialog-heading">
      <h2 id="online-title">Graj online</h2>
      <button class="reset zone-close" id="close-online-dialog" type="button" aria-label="Zamknij okno online">×</button>
    </header>
    <form id="online-form">
      <div class="zone-field"><label for="online-name">Nick przy stole</label><input id="online-name" maxlength="24" required autocomplete="nickname"></div>
      <div class="zone-field"><label for="online-room">Kod zaproszenia</label><input id="online-room" maxlength="10" spellcheck="false" autocomplete="off" autocapitalize="characters"></div>
      <div class="zone-field"><label for="online-stakes">Stawka nowego stołu</label><select id="online-stakes"></select></div>
      <details id="online-server-details">
        <summary>Adres serwera</summary>
        <div class="zone-field"><label class="zone-visually-hidden" for="online-server">Adres serwera gry</label><input id="online-server" type="url" placeholder="wss://serwer.example/ws" spellcheck="false"></div>
      </details>
      <div class="setup-controls">
        <button class="zone-art-button" type="submit" value="create">Utwórz stół</button>
        <button class="zone-art-button" type="submit" value="join">Dołącz</button>
      </div>
    </form>
    <div id="online-invitation" hidden>
      <div class="zone-field"><label for="online-link">Link do stołu</label><input id="online-link" readonly></div>
      <button class="zone-art-button" id="copy-online-link" type="button">Kopiuj zaproszenie</button>
    </div>
    <p class="menu-status" id="online-dialog-status" role="status" hidden></p>
  </dialog>
  <dialog class="setup-dialog zone-dialog zone-surface" id="session-dialog" aria-labelledby="session-title">
    <header class="zone-dialog-heading">
      <span class="zone-suit" aria-hidden="true">♠</span>
      <h2 id="session-title">Zapisz sesję</h2>
      <button class="reset zone-close" type="button" id="close-session-dialog" aria-label="Zamknij">×</button>
    </header>
    <form id="session-form">
      <div class="zone-field" id="session-list-field" hidden>
        <label id="session-list-label" for="session-list">Zapisane sesje</label>
        <select id="session-list" disabled></select>
      </div>
      <div class="zone-field" id="session-name-field">
        <label for="session-name">Nazwa sesji</label>
        <input id="session-name" type="text" maxlength="48" autocomplete="off">
      </div>
      <p class="menu-status" id="session-status" role="status" hidden></p>
      <div class="setup-controls">
        <button class="zone-art-button" id="submit-session" type="submit">Zapisz sesję</button>
        <button class="zone-art-button zone-cancel-button" id="cancel-session-dialog" type="button">Anuluj</button>
      </div>
    </form>
  </dialog>
  <dialog class="setup-dialog zone-dialog zone-surface" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <header class="zone-dialog-heading">
      <h2 id="confirm-title"></h2>
    </header>
    <p id="confirm-message"></p>
    <form method="dialog" class="setup-controls">
      <button class="zone-art-button" id="confirm-action" type="submit" value="confirm"></button>
      <button class="zone-art-button zone-cancel-button" type="submit" value="cancel" autofocus>Anuluj</button>
    </form>
  </dialog>
  <dialog class="setup-dialog profile-dialog" id="player-profile" aria-labelledby="profile-title">
    <header class="profile-header">
      <h2 id="profile-title">Twój profil</h2>
      <div class="profile-actions">
        <button class="zone-art-button" id="save-profile" type="submit" form="profile-form">Zapisz profil</button>
        <button class="zone-art-button zone-cancel-button" id="cancel-profile" type="button">Anuluj</button>
      </div>
      <button class="reset zone-close" id="close-profile" type="button" aria-label="Zamknij profil">×</button>
      <p class="menu-status" id="profile-status" role="status" hidden></p>
    </header>
    <form id="profile-form" class="profile-form">
      <label for="profile-name">Nazwa gracza</label>
      <input id="profile-name" type="text" maxlength="24" placeholder="Ty" autofocus>
      <div class="profile-avatar-picker">
        <span class="seat-avatar profile-avatar-preview" id="profile-avatar-preview" role="img" aria-label="Podgląd awatara"></span>
        <div class="profile-avatar-fields">
          <label for="profile-avatar">Avatar</label>
          <input id="profile-avatar" type="file" accept="image/*">
          <button class="reset" id="default-avatar" type="button">Domyślny awatar</button>
        </div>
      </div>
      <div id="profile-avatar-gallery"></div>
    </form>
  </dialog>
  <dialog class="setup-dialog zone-dialog zone-surface" id="table-chat-dialog" aria-labelledby="table-chat-title">
    <form id="table-chat-form">
      <header class="zone-dialog-heading">
        <h2 id="table-chat-title"><label for="table-chat-input">Napisz przy stole</label></h2>
      </header>
      <textarea id="table-chat-input" maxlength="72" rows="2" aria-describedby="table-chat-count" autofocus></textarea>
      <output id="table-chat-count" for="table-chat-input">0/72</output>
      <div class="setup-controls">
        <button class="zone-art-button" type="submit" id="send-table-chat" disabled>Wyślij</button>
        <button class="zone-art-button zone-cancel-button" type="button" id="cancel-table-chat">Anuluj</button>
      </div>
    </form>
  </dialog>
  <dialog class="loss-dialog" id="lossDialog" role="alertdialog" aria-labelledby="loss-title">
    <h2 id="loss-title">Przegrałeś</h2>
    <div class="setup-controls">
      <button class="zone-art-button zone-start-game" type="button" id="acknowledgeLoss" autofocus>Rozpocznij nową grę</button>
    </div>
  </dialog>
  <div class="zone-tooltip" id="poker-tooltip" role="tooltip" popover="manual" hidden></div>
</body>
</html>
