<!doctype html>
<html lang="pl" data-card-back="four-color">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokerZone</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/deck-themes.css">
  <link rel="stylesheet" href="css/zone.css">
  <script defer src="js/cards.js"></script>
  <script defer src="js/avatars.js"></script>
  <script defer src="js/chips.js"></script>
  <script defer src="js/bots.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/history.js"></script>
  <script defer src="js/view.js"></script>
  <script defer src="js/hand-review.js"></script>
  <script defer src="js/history-view.js"></script>
  <script defer src="js/effects.js"></script>
  <script defer src="js/profile.js"></script>
  <script defer src="js/sessions.js"></script>
  <script defer src="js/menu.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="topline">
      <h1 class="zone-brand"><span class="zone-visually-hidden">PokerZone</span></h1>
      <div class="header-controls">
        <button class="reset sound-toggle" type="button" id="sound" data-game-action="sound" aria-label="Dźwięk" aria-pressed="true">
          <span class="sound-icon" aria-hidden="true"><span class="sound-wave"></span></span>
        </button>
        <button class="header-profile" type="button" id="open-profile" aria-haspopup="dialog" aria-controls="player-profile" aria-label="Wyświetl profil">
          <span class="seat-avatar" id="header-avatar" aria-hidden="true"></span>
          <span class="header-profile-name" id="header-player-name">Ty</span>
        </button>
        <details class="game-menu" id="game-menu">
          <summary class="reset menu-summary">Menu</summary>
          <div class="menu-panel zone-surface">
            <button type="button" class="menu-item" id="save-session" data-game-action="save" aria-haspopup="dialog" disabled><span class="zone-icon" aria-hidden="true">↧</span>Zapisz sesję</button>
            <button type="button" class="menu-item" id="resume-session" data-game-action="resume" aria-haspopup="dialog" disabled><span class="zone-icon" aria-hidden="true">▷</span>Wznów sesję</button>
            <a class="menu-item" id="open-history" data-game-action="history" href="#hand-history"><span class="zone-icon zone-icon-gold" aria-hidden="true">♠</span>Historia</a>
            <label class="theme-field zone-field">
              <span><span class="zone-icon zone-icon-gold" aria-hidden="true">♠</span>Rewers kart</span>
              <select data-card-back-select></select>
            </label>
            <div class="menu-settings">
              <button type="button" class="zone-art-button zone-new-game" id="reset"><span class="zone-play-icon" aria-hidden="true"></span>Nowa gra</button>
            </div>
            <p class="menu-status" id="menu-status" data-menu-status role="status" hidden></p>
          </div>
        </details>
      </div>
    </header>
    <div id="app" aria-live="polite"></div>
    <section class="panel hand-history" id="hand-history" aria-labelledby="hand-history-title" hidden></section>
  </main>
  <dialog class="setup-dialog zone-dialog zone-surface" id="game-setup" aria-labelledby="setup-title" closedby="none">
    <header class="zone-dialog-heading setup-heading">
      <h2 class="zone-visually-hidden" id="setup-title">Nowa gra</h2>
      <span class="zone-brand setup-brand" aria-hidden="true"></span>
      <button class="reset sound-toggle" type="button" id="setup-sound" data-game-action="sound" aria-label="Dźwięk" aria-pressed="true">
        <span class="sound-icon" aria-hidden="true"><span class="sound-wave"></span></span>
      </button>
      <button class="reset zone-close" type="button" id="close-setup" aria-label="Wróć do gry" hidden>×</button>
    </header>
    <form id="setup-form">
      <div class="setup-fields">
        <label for="setup-stakes" class="zone-field">
          <span><span class="zone-icon" aria-hidden="true">◎</span>Stawki</span>
          <select id="setup-stakes" name="bigBlind"></select>
        </label>
        <label for="setup-players" class="zone-field">
          <span><span class="zone-icon zone-icon-user" aria-hidden="true"></span>Liczba graczy</span>
          <select id="setup-players" name="playerCount"></select>
        </label>
      </div>
      <fieldset class="setup-backs">
        <legend>Rewers kart</legend>
        <div class="setup-back-options" id="setup-back-options"></div>
      </fieldset>
      <div class="setup-controls">
        <button class="zone-art-button zone-start-game" type="submit" id="start-game" autofocus><span class="zone-play-icon" aria-hidden="true"></span>Rozpocznij grę</button>
      </div>
    </form>
    <div class="setup-actions">
      <button type="button" class="zone-art-button" id="setup-resume" data-game-action="resume" aria-haspopup="dialog" disabled>Wznów sesję</button>
      <a class="zone-art-button" data-game-action="history" href="#hand-history">Historia</a>
      <button type="button" class="zone-art-button" id="setup-profile" aria-haspopup="dialog" aria-controls="player-profile">Wyświetl profil</button>
    </div>
    <p class="menu-status" data-menu-status role="status" hidden></p>
  </dialog>
  <dialog class="setup-dialog zone-dialog zone-surface" id="session-dialog" aria-labelledby="session-title">
    <header class="zone-dialog-heading">
      <span class="zone-suit" aria-hidden="true">♠</span>
      <h2 id="session-title">Zapisz sesję</h2>
      <button class="reset zone-close" type="button" id="close-session-dialog" aria-label="Zamknij">×</button>
    </header>
    <form id="session-form">
      <div class="zone-field">
        <label id="session-field-label" for="session-name">Nazwa sesji</label>
        <input id="session-name" type="text" maxlength="48" autocomplete="off">
        <select id="session-list" hidden disabled></select>
      </div>
      <p class="menu-status" id="session-status" role="status" hidden></p>
      <div class="setup-controls">
        <button class="zone-art-button" id="submit-session" type="submit">Zapisz sesję</button>
        <button class="reset" id="cancel-session-dialog" type="button">Anuluj</button>
      </div>
    </form>
  </dialog>
  <dialog class="setup-dialog profile-dialog" id="player-profile" aria-labelledby="profile-title">
    <header class="profile-header">
      <h2 id="profile-title">Twój profil</h2>
      <div class="profile-actions">
        <button class="next" id="save-profile" type="submit" form="profile-form">Zapisz profil</button>
        <button class="reset" id="cancel-profile" type="button">Anuluj</button>
      </div>
      <button class="reset zone-close" id="close-profile" type="button" aria-label="Zamknij profil">×</button>
      <p class="menu-status" id="profile-status" role="status" hidden></p>
    </header>
    <form id="profile-form" class="profile-form">
      <label for="profile-name">Nazwa gracza</label>
      <input id="profile-name" type="text" maxlength="24" placeholder="Ty" autofocus>
      <div class="profile-avatar-picker">
        <span class="seat-avatar profile-avatar-preview" id="profile-avatar-preview" role="img" aria-label="Podgląd awatara"></span>
        <div class="profile-avatar-fields">
          <label for="profile-avatar">Avatar</label>
          <input id="profile-avatar" type="file" accept="image/*">
          <button class="reset" id="random-avatar" type="button">Losowy avatar</button>
        </div>
      </div>
      <div id="profile-avatar-gallery"></div>
    </form>
  </dialog>
</body>
</html>
